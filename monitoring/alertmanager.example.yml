# Copy to monitoring/alertmanager.yml (gitignored), fill in real SMTP values, then chmod 600.
# Alertmanager does not expand environment variables, so secrets live only in the copied file.
global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password: 'change-me'
  smtp_require_tls: true

route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true

# While the backend is down every other alert is noise.
inhibit_rules:
  - source_matchers: ['alertname="BackendDown"']
    target_matchers: ['alertname!="BackendDown"']
