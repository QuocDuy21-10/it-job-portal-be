# Production stack for a single VPS.
#   cp .env.example .env.production   # fill real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only the backend is published, and only on 127.0.0.1: put nginx/Caddy (TLS) in front.
# Monitoring: add --profile monitoring (see docs/11-operations/alerts.md). Set IMAGE_TAG in .env.production (docs/11-operations/rollback.md).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  backend:
    build:
      context: .
      target: production
    image: job-portal-be:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:?}:${MONGO_INITDB_ROOT_PASSWORD:?}@mongodb:27017/${MONGO_INITDB_DATABASE:-my-job-portal}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Internal only (not in ports): scraped by the monitoring profile's Prometheus.
      METRICS_PORT: 9464
    ports:
      - '127.0.0.1:${PORT:-8081}:${PORT:-8081}'
    volumes:
      - uploads:/app/public/images
      - cv_storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-my-job-portal}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}', '--appendonly', 'yes']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # Monitoring (opt-in): docker compose ... --profile monitoring up -d
  # Needs monitoring/alertmanager.yml (copy monitoring/alertmanager.example.yml). Runbook: docs/11-operations/alerts.md
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    # Loopback only: open with ssh -L 9090:127.0.0.1:9090
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - backend
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.34.2
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - backend
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  uploads:
  cv_storage:
  prometheus_data:
  alertmanager_data:
