# Production stack for a single VPS. The image is built in CI and pulled from Docker Hub (never built on the VPS).
#   cp .env.example .env.production   # fill real secrets and DOCKERHUB_USER / IMAGE_TAG / API_DOMAIN
#   ./scripts/deploy.sh               # pull + up -d --wait
# Only Caddy publishes ports (80/443). Backend, MongoDB and Redis stay on the internal network.
# Monitoring: add --profile monitoring (see docs/11-operations/alerts.md). Rollback: docs/11-operations/rollback.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  backend:
    image: ${DOCKERHUB_USER:?}/${IMAGE_NAME:-job-portal-be}:${IMAGE_TAG:?}
    init: true
    restart: unless-stopped
    mem_limit: 450m
    env_file: .env.production
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:?}:${MONGO_INITDB_ROOT_PASSWORD:?}@mongodb:27017/${MONGO_INITDB_DATABASE:-my-job-portal}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Internal only (not in ports): scraped by the monitoring profile's Prometheus.
      METRICS_PORT: 9464
    expose:
      - '${PORT:-8081}'
    volumes:
      - uploads:/app/public/images
      - cv_storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    mem_limit: 450m
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-my-job-portal}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 96m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - 'yes'
      - --maxmemory
      - 64mb
      # BullMQ requires noeviction; Redis rejects writes instead of dropping queue data when full
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 32m
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      PORT: ${PORT:-8081}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  # Monitoring (opt-in): docker compose ... --profile monitoring up -d
  # Needs monitoring/alertmanager.yml (copy monitoring/alertmanager.example.yml). Runbook: docs/11-operations/alerts.md
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    # Loopback only: open with ssh -L 9090:127.0.0.1:9090
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - backend
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.34.2
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - backend
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  uploads:
  cv_storage:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
