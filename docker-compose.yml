# Local development: MongoDB + Redis (backend runs on the host with `npm run dev`).
# `npm run docker:full` also runs the backend in a container with hot reload.
# Ports are bound to 127.0.0.1 so the databases are never reachable from the network.
# For a VPS use docker-compose.prod.yml instead.
services:
  mongodb:
    image: mongo:7.0
    container_name: job-portal-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-123456}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-my-job-portal}
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - job-portal-network
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: job-portal-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - job-portal-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: job-portal-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Override host-only values so the container reaches the compose services
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-123456}@mongodb:27017/${MONGO_INITDB_DATABASE:-my-job-portal}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '127.0.0.1:${PORT:-8081}:${PORT:-8081}'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job-portal-network
    command: npm run start:dev

networks:
  job-portal-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
