name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npm run build
      # Fails only on critical until the NestJS major upgrade clears the express/multer highs.
      - run: npm audit --omit=dev --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URL: mongodb://localhost:27017/devlink-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/monitoring":/m -w /m --entrypoint promtool prom/prometheus:v3.13.5 check config prometheus.yml
          docker run --rm -v "$PWD/monitoring":/m -w /m --entrypoint promtool prom/prometheus:v3.13.5 test rules alerts.test.yml
      - name: Alertmanager example config
        run: docker run --rm -v "$PWD/monitoring":/m -w /m --entrypoint amtool prom/alertmanager:v0.34.2 check-config alertmanager.example.yml
      - name: Production compose file
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci
          REDIS_PASSWORD: ci
          DOCKERHUB_USER: ci
          IMAGE_TAG: ci
          API_DOMAIN: ci.example.com
        run: |
          touch .env.production
          docker compose -f docker-compose.prod.yml --profile monitoring config -q
